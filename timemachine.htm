    <style>
        body { overscroll-behavior: none; touch-action: manipulation; }

        /* 畫面切換淡入淡出 */
        .fade-enter { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------------------------------- */
        /* 時光隧道特效 (純 CSS 實作)        */
        /* ---------------------------------- */
        #time-tunnel {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 50;
        }

        .tunnel-ring {
            position: absolute;
            border-radius: 50%;
            border: 4px solid transparent;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.5);
            opacity: 0;
        }

        /* 穿越到未來的動畫 */
        .travel-future .tunnel-ring { animation: warp-forward 2s cubic-bezier(0.4, 0, 1, 1) infinite; }
        @keyframes warp-forward {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; border-color: rgba(0, 255, 255, 0.8); }
            50% { opacity: 1; }
            100% { transform: scale(15) rotate(180deg); opacity: 0; border-color: rgba(255, 0, 255, 0.8); }
        }

        /* 時光倒流的動畫 */
        .travel-past .tunnel-ring { animation: warp-backward 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes warp-backward {
            0% { transform: scale(15) rotate(180deg); opacity: 0; border-color: rgba(255, 200, 0, 0.8); }
            50% { opacity: 1; }
            100% { transform: scale(0.1) rotate(0deg); opacity: 0; border-color: rgba(0, 255, 100, 0.8); }
        }

        /* 隧道環的延遲設定，創造隧道景深 */
        .tunnel-ring:nth-child(1) { animation-delay: 0s; }
        .tunnel-ring:nth-child(2) { animation-delay: 0.4s; }
        .tunnel-ring:nth-child(3) { animation-delay: 0.8s; }
        .tunnel-ring:nth-child(4) { animation-delay: 1.2s; }
        .tunnel-ring:nth-child(5) { animation-delay: 1.6s; }

        /* 時空震動效果 */
        .shake-screen { animation: screen-shake 0.1s infinite; }
        @keyframes screen-shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(-3px, 0px) rotate(1deg); }
        }

        /* 日期跳動數字 */
        #date-counter {
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            font-variant-numeric: tabular-nums; /* 確保數字等寬，防止跳動時字串左右抖動 */
        }
    </style>

                desc: "科展比賽前夕，你發現組長堅持的研究方向有一個致命錯誤，但組長平時很強勢，不喜歡被質疑...",
                choices: [
                    { text: "私下找組長，拿出數據證明錯誤，並提出修正的建議方向。", type: "best", consequence: "組長雖然一開始拉不下臉，但看到數據後接受了。團隊及時修正，最後拿下了好成績。你展現了勇敢建言。" },
                    { text: "怕惹組長生氣，選擇閉嘴，想說反正錯了是組長負責。", type: "bad", consequence: "比賽當天被評審點出錯誤，全組成績墊底。你心裡後悔沒有早點說出來，團隊榮譽也受損了。" },
                    { text: "在全組面前大肆嘲笑組長的錯誤，證明自己比較聰明。", type: "neutral", consequence: "組長惱羞成怒，把你踢出群組。雖然你是對的，但錯誤的溝通方式讓你失去了參與比賽的機會。" }
                ]
            },
            {
                theme: 'teamwork', themeName: '團隊合作與溝通', icon: '🎤', title: "上台前的怯場",
                desc: "話劇比賽輪到你們班上場了，但飾演主角的同學突然恐慌發作，躲在後台發抖說他不敢上台...",
                choices: [
                    { text: "握住他的手，陪他深呼吸，並承諾在台上會一直給他眼神支援。", type: "best", consequence: "他感受到了團隊的支持，鼓起勇氣上台，順利完成了表演。你們建立起了革命情感。" },
                    { text: "責罵他：「現在才說不敢，你想害死全班嗎！」", type: "bad", consequence: "他哭得更厲害，完全無法上台，比賽被迫棄權。你的指責成了壓垮他的最後一根稻草。" },
                    { text: "到處跟其他同學抱怨他很雷，然後自己滑手機等老師處理。", type: "neutral", consequence: "團隊士氣崩盤。老師雖然安撫了主角，但整個班級在台上的表現猶如一盤散沙。" }
                ]
            }
        ];

        // 系統狀態
        let currentGameScenarios = [];
        let currentScenarioIndex = 0;
        const currentYear = new Date().getFullYear();

        // DOM 元素 (新增顏色控制所需元素)
        const mainHeader = document.getElementById('main-header');
        const gameContainer = document.getElementById('game-container');
        const themeBadge = document.getElementById('theme-badge');
        const scenarioCounter = document.getElementById('scenario-counter');
        const scenarioIcon = document.getElementById('scenario-icon');
        const scenarioTitleText = document.getElementById('scenario-title-text');
        
        const viewScenario = document.getElementById('view-scenario');
        const viewConsequence = document.getElementById('view-consequence');
        const viewFinal = document.getElementById('view-final');
        const timeTunnel = document.getElementById('time-tunnel');
        
        const btnRewind = document.getElementById('btn-rewind');
        const btnNext = document.getElementById('btn-next');

        // ==========================================
        // 2. 遊戲邏輯與畫面切換
        // ==========================================

        function initGameData() {
            // A. 亂數抽取一個主題
            const themes = ['digital', 'interpersonal', 'honesty', 'emotion', 'teamwork'];
            const selectedTheme = themes[Math.floor(Math.random() * themes.length)];
            
            // B. 過濾出該主題的所有情境，並亂數抽取 3 個
            const themeScenarios = allScenariosData.filter(s => s.theme === selectedTheme);
            currentGameScenarios = themeScenarios.sort(() => Math.random() - 0.5).slice(0, 3);
            currentScenarioIndex = 0;
            
            // 綁定重新開始按鈕到新邏輯
            document.getElementById('btn-restart').onclick = () => {
                viewFinal.classList.add('hidden');
                viewFinal.classList.remove('flex'); // 確保結算畫面的 flex 樣式也被移除
                mainHeader.classList.remove('hidden'); // ✨修復點：恢復顯示頂部標題
                initGameData();
            };
            
            loadScenario();
        }

        function loadScenario() {
            if (currentScenarioIndex >= currentGameScenarios.length) {
                showFinalView();
                return;
            }

            const scenario = currentGameScenarios[currentScenarioIndex];
            const style = themeStyles[scenario.theme];
            
            // --- 更新 UI 顏色與圖示 (正則替換確保支援各種顏色) ---
            mainHeader.className = mainHeader.className.replace(/bg-\w+-600/, style.bg);
            scenarioCounter.className = scenarioCounter.className.replace(/bg-\w+-800/, style.badge);
            gameContainer.className = gameContainer.className.replace(/border-\w+-100|border-\w+-200/, style.border);
            themeBadge.innerText = `⏱️ 主題：${scenario.themeName}`;
            
            scenarioIcon.innerText = scenario.icon;
            scenarioTitleText.innerText = scenario.title;
            
            // 更新進度與情境描述
            scenarioCounter.innerText = `情境 ${currentScenarioIndex + 1} / ${currentGameScenarios.length}`;
            document.getElementById('scenario-desc').innerText = scenario.desc;

            // 渲染選項 (打亂順序)
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            const shuffledChoices = [...scenario.choices].sort(() => Math.random() - 0.5);

            shuffledChoices.forEach(choice => {
                const btn = document.createElement('button');
                // 為了與動態標題色塊搭配，將選項 hover 顏色設為中性或淺藍
                btn.className = 'w-full text-left bg-white hover:bg-blue-50 border-2 border-gray-200 hover:border-blue-200 p-4 md:p-5 rounded-2xl text-gray-800 font-medium transition-all active:scale-[0.98] shadow-sm hover:shadow-md text-[15px] md:text-lg';
                btn.innerText = choice.text;
                btn.onclick = () => processChoice(choice);
                choicesContainer.appendChild(btn);
            });

            // 切換視圖
            viewConsequence.classList.add('hidden');
            viewScenario.classList.remove('hidden');
            
            viewScenario.classList.remove('fade-enter');
            void viewScenario.offsetWidth; // trigger reflow
            viewScenario.classList.add('fade-enter');
        }

        function processChoice(choice) {
            // 1. 啟動穿越未來的特效
            triggerTimeTravel('future', () => {
                
                // 2. 準備後果畫面的內容
                const consequenceBox = document.getElementById('consequence-box');
                const consequenceIcon = document.getElementById('consequence-icon');
                document.getElementById('consequence-text').innerText = choice.consequence;

                // 根據選擇的好壞設定顏色與按鈕
                if (choice.type === 'best') {
                    consequenceBox.className = 'bg-emerald-50 p-6 rounded-2xl shadow-md border-l-8 border-emerald-500 mb-6 flex-1';
                    consequenceIcon.innerText = '✨';
                    btnRewind.classList.add('hidden');
                    btnNext.classList.remove('hidden');
                    btnNext.style.display = 'flex'; // Tailwind hidden override
                    
                    // 播放過關特效
                    setTimeout(() => {
                        confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
                    }, 500);

                } else if (choice.type === 'bad') {
                    consequenceBox.className = 'bg-rose-50 p-6 rounded-2xl shadow-md border-l-8 border-rose-500 mb-6 flex-1';
                    consequenceIcon.innerText = '⛈️';
                    btnRewind.classList.remove('hidden');
                    btnNext.classList.add('hidden');
                    btnNext.style.display = 'none';

                } else { // neutral
                    consequenceBox.className = 'bg-amber-50 p-6 rounded-2xl shadow-md border-l-8 border-amber-500 mb-6 flex-1';
                    consequenceIcon.innerText = '🍂';
                    btnRewind.classList.remove('hidden');
                    btnNext.classList.add('hidden');
                    btnNext.style.display = 'none';
                }

                // 切換視圖
                viewScenario.classList.add('hidden');
                viewConsequence.classList.remove('hidden');
                
                viewConsequence.classList.remove('fade-enter');
                void viewConsequence.offsetWidth;
                viewConsequence.classList.add('fade-enter');
            });
        }

        function triggerRewind() {
            // 啟動倒流過去的特效
            triggerTimeTravel('past', () => {
                // 回到選擇畫面
                viewConsequence.classList.add('hidden');
                viewScenario.classList.remove('hidden');
                
                viewScenario.classList.remove('fade-enter');
                void viewScenario.offsetWidth;
                viewScenario.classList.add('fade-enter');
            });
        }

        function nextScenario() {
            currentScenarioIndex++;
            loadScenario();
        }

        // ==========================================
        // 3. 時光穿梭特效引擎 (CSS Animation Controller)
        // ==========================================
        function triggerTimeTravel(direction, onComplete) {
            const travelText = document.getElementById('travel-text');
            const dateCounter = document.getElementById('date-counter');
            
            // 設定動畫類型
            timeTunnel.className = direction === 'future' ? 'travel-future shake-screen flex' : 'travel-past shake-screen flex';
            timeTunnel.style.display = 'flex';
            travelText.innerText = direction === 'future' ? '時間快轉中...' : '時光倒流中...';

            // 1. 計算日期 (今天與 7 天後)
            const today = new Date();
            const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000); // 7 天後的毫秒數
            
            let startTime = direction === 'future' ? today.getTime() : nextWeek.getTime();
            let endTime = direction === 'future' ? nextWeek.getTime() : today.getTime();

            // 格式化日期函式 (YYYY-MM-DD)
            const formatDate = (ms) => {
                const d = new Date(ms);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            };

            // 2. 使用 requestAnimationFrame 製作平滑數字跳動
            const duration = 2000; // 動畫持續時間 2 秒
            const startAnimTime = performance.now();

            function updateTime(currentTime) {
                let elapsed = currentTime - startAnimTime;
                let progress = Math.min(elapsed / duration, 1);
                
                // 根據進度計算當前的毫秒數並更新畫面
                let currentMs = startTime + (endTime - startTime) * progress;
                dateCounter.innerText = formatDate(currentMs);

                if (progress < 1) {
                    requestAnimationFrame(updateTime);
                }
            }
            requestAnimationFrame(updateTime);

            // 3. 2.5 秒後結束特效 (預留 0.5 秒讓玩家看清楚最終停留在哪一天)
            setTimeout(() => {
                timeTunnel.style.display = 'none';
                timeTunnel.className = '';
                if(onComplete) onComplete();
            }, 2500);
        }

        function showFinalView() {
            mainHeader.classList.add('hidden');
            viewScenario.classList.add('hidden');
            viewConsequence.classList.add('hidden');
            viewFinal.classList.remove('hidden');
            viewFinal.classList.add('flex');
            
            // 慶祝特效
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        // 綁定按鈕事件
        btnRewind.onclick = triggerRewind;
        btnNext.onclick = nextScenario;

        // 啟動遊戲 (改為呼叫新的初始化邏輯)
        window.onload = initGameData;

    </script>
</body>
</html>
