<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- 1. 平板感測邊界 (Tablet Sensor Frame - 象徵數位設備與安全的互動空間) -->
  <rect x="15" y="20" width="90" height="80" rx="14" fill="none" stroke="#1D3557" stroke-width="4" stroke-dasharray="10 4" opacity="0.6"/>
  <!-- 底部硬體感測指示燈 -->
  <circle cx="60" cy="92" r="3" fill="#1D3557" opacity="0.6" />

  <!-- 2. 正念呼吸律動波浪 (Mindful Breathing Waves - 完美對稱的正弦波) -->
  <!-- 吸氣波浪 (Inhale Wave - 向上擴張、充滿能量) -->
  <path d="M 15 60 C 30 15, 45 15, 60 60 C 75 105, 90 105, 105 60" fill="none" stroke="#2A9D8F" stroke-width="7" stroke-linecap="round" />
  
  <!-- 呼氣波浪 (Exhale Wave - 向下釋放、平穩放鬆) -->
  <path d="M 15 60 C 30 105, 45 105, 60 60 C 75 15, 90 15, 105 60" fill="none" stroke="#A8DADC" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- 3. 感測擷取節點 (Sensor Data Points - 象徵平板的即時互動回饋) -->
  <!-- 位於波峰與波谷的動態感測點 -->
  <circle cx="37.5" cy="37.5" r="4.5" fill="#F4A261" />
  <circle cx="82.5" cy="82.5" r="4.5" fill="#F4A261" />

  <!-- 4. 覺察焦點與平衡 (Mindfulness Focus Core - 身心匯聚的奇異點) -->
  <!-- 核心發光暈影 -->
  <circle cx="60" cy="60" r="12" fill="#E9C46A" opacity="0.3"/>
  <!-- 實體焦點 -->
  <circle cx="60" cy="60" r="6" fill="#E9C46A" />
  <circle cx="60" cy="60" r="2.5" fill="#FFFFFF" />
</svg>
