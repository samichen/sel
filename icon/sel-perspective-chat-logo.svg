<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- 1. 換位思考循環軌道 (Perspective Exchange Orbit - 象徵觀點取替與理解循環) -->
  <!-- 頂部順時針箭頭 -->
  <path d="M 15 50 C 15 10, 105 10, 105 50" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <polygon points="100,43 110,43 105,53" fill="#2A9D8F"/>
  
  <!-- 底部逆時針箭頭 -->
  <path d="M 105 70 C 105 110, 15 110, 15 70" fill="none" stroke="#E9C46A" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <polygon points="10,77 20,77 15,67" fill="#E9C46A"/>

  <!-- 2. 對話框 A (Cognitive Perspective - 思考、聆聽與陳述視角) -->
  <rect x="22" y="42" width="36" height="36" rx="8" fill="#457B9D" />
  <path d="M 30 77 L 30 89 L 40 77 Z" fill="#457B9D" />
  <!-- 內容：刪節號 (代表保留空間、聆聽與訊息輸入) -->
  <circle cx="32" cy="60" r="2.5" fill="#FFFFFF" />
  <circle cx="40" cy="60" r="2.5" fill="#FFFFFF" />
  <circle cx="48" cy="60" r="2.5" fill="#FFFFFF" />

  <!-- 3. 對話框 B (Affective Empathy - 情感與同理視角) -->
  <rect x="62" y="42" width="36" height="36" rx="8" fill="#F4A261" />
  <path d="M 90 77 L 90 89 L 80 77 Z" fill="#F4A261" />
  <!-- 內容：愛心 (代表情緒接納與同理共鳴) -->
  <path d="M 80 65 C 80 65, 73 58, 73 53 A 4 4 0 0 1 80 51 A 4 4 0 0 1 87 53 C 87 58, 80 65, 80 65 Z" fill="#FFFFFF" />
</svg>
